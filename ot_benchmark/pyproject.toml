[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ot-benchmark"
version = "2.0.0"
description = "最优传输算法自动评测系统 — 面向高维稀疏数据"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "SCUT CS Innovation Team"},
]
keywords = ["optimal-transport", "benchmark", "sparse-data", "wasserstein"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "POT>=0.9.0",
    "matplotlib>=3.7",
    "psutil>=5.9",
    "tqdm>=4.65",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "rich>=13.0",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.0",
    "cupy-cuda12x>=12.0; platform_system == 'Linux'",
]
cloud = [
    "esdk-obs-python>=3.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
]

[project.scripts]
ot-benchmark = "ot_benchmark.main:main"

[tool.setuptools.packages.find]
include = ["ot_benchmark*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
